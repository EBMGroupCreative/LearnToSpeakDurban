.ng-area.n3{flex:none;height:clamp(340px,calc(100svh - 320px),620px)}
.n3-beach{position:absolute;left:0;right:0;top:0;background:linear-gradient(var(--blue) 0 55%,var(--highlight) 55%);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:14px;padding-bottom:16px;overflow:hidden}
.n3-finish{position:absolute;left:0;right:0;height:0;border-top:4px dashed var(--ink);z-index:1}.n3-finish span{position:absolute;right:12px;top:6px;font:500 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase}
.n3-sign{position:absolute;z-index:2;padding:8px 12px;border-radius:8px;background:#fff;box-shadow:var(--shadow-sm);font:600 11px var(--font-mono);letter-spacing:.06em;white-space:nowrap;color:var(--ink)}
.n3-sign{border-radius:999px;padding:10px 16px}.n3-beach{transition:height .6s ease-out}
.gm-duck{position:absolute;z-index:3;transform:translate(-50%,-50%);height:auto;display:block;pointer-events:none;user-select:none;filter:drop-shadow(0 10px 6px rgba(0,0,0,.18))}
.gm-duck.fly{animation:gmflap .5s ease-in-out infinite}@keyframes gmflap{50%{transform:translate(-50%,-58%)}}
.gm-duck.wobble{animation:gmwob .24s ease-in-out infinite}@keyframes gmwob{0%,100%{transform:translate(-50%,-50%) rotate(-12deg)}50%{transform:translate(-50%,-50%) rotate(12deg)}}
.gm-duck.land{animation:gmglide .7s ease-out both,gmwaddle .3s ease-in-out .7s 4}@keyframes gmglide{from{transform:translate(-50%,-50%) scale(1.4)}to{transform:translate(-50%,-50%) scale(1)}}@keyframes gmwaddle{0%,100%{transform:translate(-50%,-50%) rotate(0)}25%{transform:translate(-56%,-52%) rotate(-7deg)}75%{transform:translate(-44%,-52%) rotate(7deg)}}
.gm-duck img{display:block;width:100%;height:auto}.gm-duck.boost{filter:drop-shadow(0 10px 6px rgba(0,0,0,.18)) drop-shadow(0 0 12px #fff)}
@keyframes gmdrift{0%,100%{transform:translate(-50%,-50%) rotate(-7deg)}50%{transform:translate(-50%,-50%) rotate(7deg)}}
.gm-big{font-size:13px;padding:9px 13px}.gm-pow{background:#fff;color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}.gm-badge{margin-left:7px;padding:2px 6px;border-radius:999px;background:#e5322d;color:#fff;font-size:10px;letter-spacing:0}.gm-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e5322d;margin-left:7px;vertical-align:1px}
.gm-art{position:absolute;z-index:2;display:block;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.22))}.gm-art.glow{z-index:3;animation:gmglow 1.1s ease-in-out infinite}@keyframes gmglow{0%,100%{filter:drop-shadow(0 0 6px #ffd23f) drop-shadow(0 0 14px rgba(255,190,40,.75))}50%{filter:drop-shadow(0 0 10px #ffe27a) drop-shadow(0 0 28px rgba(255,190,40,.95))}}
.gm-halo{position:absolute;z-index:2;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,226,110,.95) 0%,rgba(255,196,40,.55) 38%,rgba(255,170,0,0) 70%);animation:gmhalo 1.1s ease-in-out infinite}.gm-halo>span{position:absolute;inset:6%;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.85) 0 6deg,rgba(255,255,255,0) 6deg 30deg);-webkit-mask:radial-gradient(circle,transparent 42%,#000 46%,#000 60%,transparent 70%);mask:radial-gradient(circle,transparent 42%,#000 46%,#000 60%,transparent 70%);animation:gmspin 4s linear infinite}@keyframes gmhalo{0%,100%{transform:translate(-50%,-50%) scale(.9)}50%{transform:translate(-50%,-50%) scale(1.08)}}@keyframes gmspin{to{transform:rotate(360deg)}}
.gm-edge{position:absolute;top:0;bottom:0;z-index:1;pointer-events:none;background:rgba(18,22,30,.32);box-shadow:inset -3px 0 0 rgba(255,255,255,.55)}.gm-edge.r{box-shadow:inset 3px 0 0 rgba(255,255,255,.55)}
.gm-arch{position:absolute;z-index:2;transform:translate(-50%,-100%);border:8px solid #fff;border-bottom:0;border-radius:999px 999px 0 0;pointer-events:none}.gm-arch span{position:absolute;left:50%;top:-34px;transform:translateX(-50%);padding:6px 10px;border-radius:999px;background:#fff;font:600 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;color:var(--ink)}
.gm-score{font:800 22px/1 var(--font-grotesk);letter-spacing:-.01em;color:var(--ink);font-variant-numeric:tabular-nums}.gm-x{font:800 22px/1 var(--font-grotesk);color:var(--ink-3)}.gm-x.on{color:var(--blue)}
.gm-pop{position:absolute;z-index:6;transform:translate(-50%,-50%);font:800 18px/1 var(--font-grotesk);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25),0 2px 8px rgba(0,0,0,.25);white-space:nowrap;pointer-events:none}.gm-pop.big{font-size:30px;color:var(--highlight)}.gm-pop.bad{color:#fff;background:#e5322d;text-shadow:none;padding:6px 10px;border-radius:999px;font-size:18px}
.gm-hearts{display:flex;gap:4px;font-size:26px;line-height:1;letter-spacing:0}.gm-hearts>span{color:#e5322d;opacity:.22}.gm-hearts>span.on{color:#e5322d;opacity:1}
.gm-puff{position:absolute;z-index:0;height:38px;border-radius:999px;background:rgba(255,255,255,.28);pointer-events:none}
.ng-chip{position:absolute;z-index:2;transform:translate(-50%,-50%);padding:9px 13px;border-radius:999px;font:500 12px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;pointer-events:none}
.ng-chip.good{background:var(--highlight);color:var(--ink)}.ng-chip.bad{background:var(--popover);color:#fff}
.ng-tag{padding:6px 10px;border-radius:999px;background:#fff;font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase}
.ng-toast{position:absolute;z-index:4;top:14px;left:50%;transform:translateX(-50%);background:var(--popover);color:#fff;padding:10px 16px;border-radius:10px;font:500 12px var(--font-mono);letter-spacing:.06em;white-space:nowrap}
.ng-pause{position:absolute;inset:0;z-index:6;background:rgba(239,239,237,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;cursor:default}
.ng-area.n3 .ng-pause{justify-content:safe center;overflow-y:auto;gap:12px}.ng-area.n3 .ng-pause .lead{font-size:clamp(14px,1.6vh + 6px,18px);max-width:58ch}.game-stage:has(.ng-area.n3){min-height:0}
.ng-area.kc{flex:none;height:clamp(440px,calc(100svh - 330px),620px);background:linear-gradient(#f2e2c0,#e8d1a2);cursor:default}.ng-area.kc.armed{cursor:crosshair}
.ng-area.kc .ng-pause{justify-content:safe center;overflow-y:auto;gap:12px}.ng-area.kc .ng-toast{top:78px}
.kc-rules{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px;width:min(780px,100%);text-align:left}.kc-rules li{padding:10px 14px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px var(--border-hair);font-size:15px;line-height:1.4}
.kc-box{position:absolute;inset:64px 14px 14px;border-radius:26px;background:var(--blue);box-shadow:0 16px 30px rgba(60,40,10,.22),inset 0 2px 0 rgba(255,255,255,.35)}
.kc-field{position:absolute;inset:0;pointer-events:none}.kc-field.haze{animation:kcHaze .45s ease-in-out infinite alternate}
.kc-in{position:absolute;border-radius:16px;background:linear-gradient(#edf4f9,#d8e6f0);box-shadow:inset 0 12px 20px rgba(20,50,110,.24),inset 0 0 0 2px rgba(255,255,255,.7)}
.kc-shade{position:absolute;border-radius:14px;background:repeating-linear-gradient(135deg,rgba(20,40,80,.15) 0 10px,rgba(20,40,80,.08) 10px 20px);padding:8px 10px}.kc-shade span{font:500 10px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.kc-slot-t{position:absolute;border-radius:14px;box-shadow:inset 0 0 0 3px var(--blue);background:rgba(61,139,242,.08)}
.kc-sun{position:absolute;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,210,80,.7) 0,rgba(255,170,40,.38) 45%,rgba(255,170,40,0) 70%)}
.kc-it{position:absolute;z-index:2;transform:translate(-50%,-50%);appearance:none;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;border-radius:14px;pointer-events:auto}
.kc-it:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}.kc-it.drag{z-index:8;cursor:grabbing}
.kc-pic{position:relative;display:block;animation:kcDrop .45s cubic-bezier(.2,.9,.3,1.3) both}.kc-pic>img,.kc-pic>svg{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(20,40,80,.22));transition:transform .12s}
.kc-it:hover .kc-pic>*{transform:scale(1.05)}
.kc-m{display:block;height:7px;border-radius:4px;background:rgba(17,17,17,.12);overflow:hidden}.kc-m>i{display:block;height:100%;border-radius:4px}
.kc-it.hot .kc-pic>*{animation:kcWob .22s ease-in-out infinite}.kc-it.hot .kc-m{box-shadow:0 0 0 2px rgba(229,50,45,.3)}.kc-it.sun .kc-m{box-shadow:0 0 0 2px rgba(240,138,36,.6)}
.kc-ice{position:absolute;left:50%;top:44%;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.95) 0 22%,rgba(190,225,255,.75) 40%,rgba(190,225,255,0) 68%);animation:kcIce .4s ease-out forwards}
.kc-ice::before{content:'';position:absolute;inset:16%;background:linear-gradient(35deg,transparent 48.5%,#fff 48.5% 51.5%,transparent 51.5%),linear-gradient(-58deg,transparent 49%,#fff 49% 51%,transparent 51%),linear-gradient(98deg,transparent 49%,rgba(255,255,255,.9) 49% 51%,transparent 51%)}
.kc-frost{position:absolute;z-index:3;pointer-events:none;border-radius:16px;background:rgba(225,242,255,.3);box-shadow:inset 0 0 40px 12px rgba(255,255,255,.95),inset 0 0 0 3px #bfe2ff}
.kc-vig{position:absolute;inset:0;z-index:4;pointer-events:none;box-shadow:inset 0 0 90px 24px rgba(229,80,30,.45);animation:kcPulse .5s ease-in-out infinite alternate}
.kc-flash{position:absolute;inset:0;z-index:7;pointer-events:none;background:rgba(229,50,45,.32)}
.kc-gull{position:absolute;z-index:5;transform:translate(-50%,-100%);pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:2px;animation:kcPeck .3s ease-in-out infinite}.kc-gull img{display:block;width:100%;height:auto;filter:drop-shadow(0 4px 4px rgba(0,0,0,.2))}.kc-gull.off{animation:kcFly .6s ease-in forwards}
.kc-tbar{display:block;height:5px;border-radius:3px;background:rgba(17,17,17,.15);overflow:hidden;width:70%}.kc-tbar>i{display:block;height:100%;background:#e5322d}
.kc-arm{position:absolute;z-index:5;height:30px;border-radius:15px;background:repeating-linear-gradient(90deg,#2f6fe0 0 5px,#2a63cc 5px 8px);transform-origin:0 50%;cursor:pointer;box-shadow:0 4px 8px rgba(0,0,0,.2);touch-action:none}.kc-arm img{position:absolute;top:50%;width:auto;transform:translateY(-50%) rotate(90deg);pointer-events:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.2))}
.kc-bomb{position:absolute;z-index:6;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle at 35% 30%,#fff,#bfe2ff 40%,#3d8bf2);color:var(--ink);font:600 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;box-shadow:0 0 0 6px rgba(61,139,242,.25),0 0 24px 6px rgba(120,190,255,.8);animation:kcBomb .5s ease-in-out infinite alternate;touch-action:none}
.kc-trail{position:absolute;z-index:6;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(190,225,255,.6) 50%,rgba(190,225,255,0) 70%)}
.kc-pop{position:absolute;z-index:7;transform:translate(-50%,-50%);padding:7px 12px;border-radius:999px;background:#e5322d;color:#fff;font:600 12px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;pointer-events:none;box-shadow:var(--shadow-sm)}.kc-pop.good{background:var(--blue)}
.kc-toast{animation:kcToast .35s cubic-bezier(.2,.9,.3,1.3) both;z-index:6}
.kc-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.kc-tray{position:absolute;top:14px;right:14px;z-index:5;display:flex;gap:8px;align-items:center}
.kc-drop{position:absolute;z-index:6;transform:translate(-50%,-50%);appearance:none;border:0;padding:0;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95) 0 45%,rgba(190,225,255,.6) 62%,rgba(190,225,255,0) 72%);cursor:pointer;display:grid;place-items:center;animation:kcDropIn .4s cubic-bezier(.2,.9,.3,1.3) both,kcBob .6s ease-in-out .4s infinite alternate;touch-action:none}
.kc-drop>img{width:62%;height:62%;object-fit:contain;filter:drop-shadow(0 4px 4px rgba(20,60,120,.25))}.kc-drop>span{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);padding:3px 8px;border-radius:999px;background:var(--blue);color:#fff;font:600 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.kc-ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);pointer-events:none}.kc-ring circle{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linecap:round}
@keyframes kcDropIn{from{opacity:0;transform:translate(-50%,-120%) scale(.6)}}@keyframes kcBob{to{margin-top:-5px}}
.kc-gauge{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:999px;background:#fff;box-shadow:var(--shadow-sm);font:600 12px var(--font-mono);color:var(--ink)}.kc-gauge img{width:30px;height:30px;object-fit:contain;display:block}.kc-gauge b{font:800 22px/1 var(--font-grotesk);letter-spacing:-.02em;font-variant-numeric:tabular-nums;min-width:26px}
.kc-gauge>i{display:block;width:48px;height:7px;border-radius:4px;background:var(--paper-4);overflow:hidden}.kc-gauge>i>i{display:block;height:100%;border-radius:4px;background:var(--blue)}
.kc-gauge.low b{color:#e5322d}.kc-gauge.no{box-shadow:0 0 0 2px #e5322d}.kc-gauge.no>i>i{background:#e5322d}
.kc-blk{appearance:none;border:0;display:flex;align-items:center;gap:6px;padding:5px 12px 5px 6px;border-radius:999px;background:#fff;box-shadow:var(--shadow-sm);cursor:pointer;font:600 12px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);touch-action:none}.kc-blk img{width:28px;height:28px;object-fit:contain;display:block}.kc-blk.on{background:var(--blue);color:#fff;box-shadow:0 0 0 3px rgba(61,139,242,.3)}
@media (max-width:560px){.kc-gauge>i{width:32px}.kc-blk{padding-right:9px}}
.kc-stats{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}.kc-stat{display:flex;flex-direction:column;gap:8px;padding:16px 22px;border-radius:14px;background:var(--paper-3);min-width:150px;text-align:center}.kc-stat b{font:800 34px/1 var(--font-grotesk);letter-spacing:-.03em;font-variant-numeric:tabular-nums}.kc-stat.on{background:var(--highlight)}
.kc-prev{padding:14px;border-radius:20px;background:var(--blue);box-shadow:0 10px 20px rgba(0,0,0,.14)}.kc-prev-in{display:flex;gap:16px;align-items:flex-end;padding:16px 20px;border-radius:12px;background:linear-gradient(#edf4f9,#d8e6f0);box-shadow:inset 0 8px 14px rgba(20,50,110,.22)}
.kc-pv{display:flex;flex-direction:column;align-items:center;gap:8px}.kc-pv .kc-pic{width:62px;height:62px;animation:none}.kc-pv .kc-m{width:54px}.kc-pv.hot .kc-pic>*{animation:kcWob .22s ease-in-out infinite}
@keyframes kcDrop{from{opacity:0;transform:translateY(-36px) scale(1.3)}}@keyframes kcWob{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}@keyframes kcPulse{from{opacity:.45}to{opacity:1}}
@keyframes kcIce{0%{opacity:1;transform:translate(-50%,-50%) scale(.35)}60%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}@keyframes kcToast{from{opacity:0;transform:translateX(-50%) scale(1.4)}to{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes kcHaze{from{transform:skewX(-.5deg) scaleY(1.004)}to{transform:skewX(.5deg) scaleY(.996)}}@keyframes kcPeck{0%,100%{transform:translate(-50%,-100%) rotate(0)}50%{transform:translate(-50%,-94%) rotate(9deg)}}@keyframes kcFly{to{transform:translate(60%,-280%) rotate(-20deg);opacity:0}}
@keyframes kcBomb{to{box-shadow:0 0 0 12px rgba(61,139,242,.15),0 0 36px 10px rgba(120,190,255,.95)}}
@media (prefers-reduced-motion:reduce){.kc-it.hot .kc-pic>*,.kc-pv.hot .kc-pic>*,.kc-field.haze,.kc-gull{animation:none}}
.snap-wrap{position:relative;width:min(760px,100%)}
.snap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sn-c{appearance:none;border:0;aspect-ratio:4/3;border-radius:14px;cursor:pointer;padding:8px;display:grid;place-items:center;text-align:center;color:var(--ink);transition:transform .15s,background .15s;overflow-wrap:anywhere}
.sn-c.down{background:var(--blue);color:#fff}.sn-c.down:hover{transform:translateY(-2px)}
.sn-c.w{background:#fff;box-shadow:inset 0 0 0 1px var(--border-hair);font:800 clamp(15px,1.8vw,24px)/1.05 var(--font-grotesk);letter-spacing:-.02em}
.sn-c.m{background:#fff;box-shadow:inset 0 0 0 1px var(--border-hair);font:500 clamp(12px,1.3vw,16px)/1.25 var(--font-grotesk)}
.sn-c.ok{background:var(--highlight);box-shadow:none;cursor:default}.sn-c.no{background:var(--popover);color:#fff;box-shadow:none}
.gp-n3{display:flex;flex-direction:column;align-items:center;gap:10px}
.gp-duck{display:block;height:130px;width:auto;max-width:none;filter:drop-shadow(0 10px 14px rgba(0,0,0,.18));transform:rotate(-6deg)}
.gp-card{width:96px;height:72px;border-radius:12px;display:grid;place-items:center;text-align:center;padding:6px;background:#fff;box-shadow:inset 0 0 0 1px var(--border-hair)}.gp-card.w{font:800 20px var(--font-grotesk);letter-spacing:-.02em}.gp-card.m{background:var(--highlight);box-shadow:none;font:500 14px var(--font-grotesk)}.gp-card.down{background:var(--blue);color:#fff;box-shadow:none}
@media (max-width:560px){.sn-c{aspect-ratio:1/1;border-radius:10px;padding:5px}.snap{gap:6px}}
.ls-map{padding:20px;display:flex;flex-direction:column;gap:14px;max-width:900px}.ls-map iframe{width:100%;height:clamp(280px,32vw,440px);border:0;border-radius:14px;display:block;background:var(--paper-3)}
.ls-hidden{padding:28px 32px;border-radius:16px;background:var(--paper-3);color:var(--ink-2);font-size:19px;max-width:900px}
/* translate */
.tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.tr-pane{padding:22px 26px;display:flex;flex-direction:column;gap:12px;min-height:340px}
.tr-in{flex:1;border:0;outline:0;resize:none;font:400 21px/1.45 var(--font-grotesk);color:var(--ink);background:transparent;min-height:180px;padding:0}
.tr-out{font:400 21px/1.6 var(--font-grotesk);white-space:pre-wrap;padding-top:4px}
.tr-out .sel{font-weight:700;line-height:1.15}.tok{position:relative}
.tr-out .pop{font-size:14px}
/* exam */
.exam{max-width:1120px;margin:0 auto}
.ex-card{padding:36px}
.segs{display:flex;gap:4px}.segs i{flex:1;height:6px;border-radius:3px;background:var(--paper-4);transition:background .2s}.segs i.d{background:var(--blue)}
.ex-q{font-size:clamp(24px,2.6vw,34px);font-weight:700;letter-spacing:-.025em;line-height:1.15;margin:16px 0 28px;text-wrap:pretty}
.ex-ans{display:flex;flex-direction:column;gap:10px}
.ans{appearance:none;border:0;background:#fff;text-align:left;display:flex;align-items:center;gap:14px;width:100%;padding:14px 18px 14px 14px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--border-hair);cursor:pointer;font:400 19px/1.35 var(--font-grotesk);color:var(--ink);transition:background .12s}
.ans:hover:not(:disabled){background:var(--paper-3)}.ans:disabled{cursor:default}
.ans .k{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--paper-3);font:600 13px var(--font-mono);flex:none}
.ans .tag{margin-left:auto;flex:none}
.ans.right{background:var(--highlight);box-shadow:none}.ans.right .k{background:var(--blue);color:#fff}
.ans.wrong{background:var(--popover);color:#fff;box-shadow:none}.ans.wrong .k{background:var(--popover-2);color:#fff}
.ans.dim{opacity:.5}
.fail{background:var(--popover);color:#fff;padding:44px;border-radius:24px;margin-top:56px}
.cert{position:relative;overflow:hidden;padding:56px 56px 32px;border-radius:28px;text-align:center;margin-top:56px}
.cert-name{font-size:clamp(48px,7vw,100px);margin:14px 0 18px;text-wrap:balance}
