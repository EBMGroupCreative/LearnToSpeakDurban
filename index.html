.lb-pos{font:500 15px var(--font-mono);color:var(--ink-3)}.lb-row.podium .lb-pos{color:var(--blue);font-weight:700}

.lb-pts{font:800 22px var(--font-grotesk);letter-spacing:-.02em;font-variant-numeric:tabular-nums}

.lb-gap{text-align:center;padding:14px}
.lb-side{display:flex;flex-direction:column;gap:20px;position:sticky;top:110px}
.lb-me{padding:24px 26px;display:flex;flex-direction:column;gap:16px}.lb-big{font-size:clamp(64px,6vw,104px);padding-top:8px}

.lb-feed{padding:20px 24px;display:flex;flex-direction:column;gap:12px}.lb-f{font-size:15px;line-height:1.45;color:var(--ink-2);animation:lbIn .4s var(--ease-out)}.lb-f b{color:var(--ink)}

.mb{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:20px;align-items:start;margin-bottom:32px}.mb .lb-big{font-size:clamp(56px,5vw,88px)}
/* new games: great migration, keep it cold, snap */

.gm-duck{position:absolute;z-index:3;transform:translate(-50%,-50%);height:auto;display:block;pointer-events:none;user-select:none;filter:drop-shadow(0 10px 6px rgba(0,0,0,.18))}

.gm-duck.wobble{animation:gmwob .24s ease-in-out infinite}@keyframes gmwob{0%,100%{transform:translate(-50%,-50%) rotate(-12deg)}50%{transform:translate(-50%,-50%) rotate(12deg)}}
.gm-duck.land{animation:gmglide .7s ease-out both,gmwaddle .3s ease-in-out .7s 4}@keyframes gmglide{from{transform:translate(-50%,-50%) scale(1.4)}to{transform:translate(-50%,-50%) scale(1)}}@keyframes gmwaddle{0%,100%{transform:translate(-50%,-50%) rotate(0)}25%{transform:translate(-56%,-52%) rotate(-7deg)}75%{transform:translate(-44%,-52%) rotate(7deg)}}

.gm-big{font-size:13px;padding:9px 13px}.gm-pow{background:#fff;color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}.gm-badge{margin-left:7px;padding:2px 6px;border-radius:999px;background:#e5322d;color:#fff;font-size:10px;letter-spacing:0}.gm-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e5322d;margin-left:7px;vertical-align:1px}

.gm-edge{position:absolute;top:0;bottom:0;z-index:1;pointer-events:none;background:rgba(18,22,30,.32);box-shadow:inset -3px 0 0 rgba(255,255,255,.55)}.gm-edge.r{box-shadow:inset 3px 0 0 rgba(255,255,255,.55)}
.gm-arch{position:absolute;z-index:2;transform:translate(-50%,-100%);border:8px solid #fff;border-bottom:0;border-radius:999px 999px 0 0;pointer-events:none}.gm-arch span{position:absolute;left:50%;top:-34px;transform:translateX(-50%);padding:6px 10px;border-radius:999px;background:#fff;font:600 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;color:var(--ink)}
.gm-score{font:800 22px/1 var(--font-grotesk);letter-spacing:-.01em;color:var(--ink);font-variant-numeric:tabular-nums}.gm-x{font:800 22px/1 var(--font-grotesk);color:var(--ink-3)}.gm-x.on{color:var(--blue)}
.gm-pop{position:absolute;z-index:6;transform:translate(-50%,-50%);font:800 18px/1 var(--font-grotesk);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25),0 2px 8px rgba(0,0,0,.25);white-space:nowrap;pointer-events:none}.gm-pop.big{font-size:30px;color:var(--highlight)}.gm-pop.bad{color:#fff;background:#e5322d;text-shadow:none;padding:6px 10px;border-radius:999px;font-size:18px}
.gm-hearts{display:flex;gap:4px;font-size:26px;line-height:1;letter-spacing:0}.gm-hearts>span{color:#e5322d;opacity:.22}.gm-hearts>span.on{color:#e5322d;opacity:1}

.ng-chip{position:absolute;z-index:2;transform:translate(-50%,-50%);padding:9px 13px;border-radius:999px;font:500 12px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;pointer-events:none}

.ng-toast{position:absolute;z-index:4;top:14px;left:50%;transform:translateX(-50%);background:var(--popover);color:#fff;padding:10px 16px;border-radius:10px;font:500 12px var(--font-mono);letter-spacing:.06em;white-space:nowrap}

.ng-area.n3 .ng-pause{justify-content:safe center;overflow-y:auto;gap:12px}.ng-area.n3 .ng-pause .lead{font-size:clamp(14px,1.6vh + 6px,18px);max-width:58ch}.game-stage:has(.ng-area.n3){min-height:0}
.ng-area.kc{flex:none;height:clamp(440px,calc(100svh - 330px),620px);background:linear-gradient(#f2e2c0,#e8d1a2);cursor:default}.ng-area.kc.armed{cursor:crosshair}

.kc-rules{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px;width:min(780px,100%);text-align:left}.kc-rules li{padding:10px 14px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px var(--border-hair);font-size:15px;line-height:1.4}

.kc-sun{position:absolute;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,210,80,.7) 0,rgba(255,170,40,.38) 45%,rgba(255,170,40,0) 70%)}
.kc-it{position:absolute;z-index:2;transform:translate(-50%,-50%);appearance:none;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;border-radius:14px;pointer-events:auto}

.kc-pic{position:relative;display:block;animation:kcDrop .45s cubic-bezier(.2,.9,.3,1.3) both}.kc-pic>img,.kc-pic>svg{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(20,40,80,.22));transition:transform .12s}

.kc-it.hot .kc-pic>*{animation:kcWob .22s ease-in-out infinite}.kc-it.hot .kc-m{box-shadow:0 0 0 2px rgba(229,50,45,.3)}.kc-it.sun .kc-m{box-shadow:0 0 0 2px rgba(240,138,36,.6)}

.kc-tbar{display:block;height:5px;border-radius:3px;background:rgba(17,17,17,.15);overflow:hidden;width:70%}.kc-tbar>i{display:block;height:100%;background:#e5322d}

.kc-bomb{position:absolute;z-index:6;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle at 35% 30%,#fff,#bfe2ff 40%,#3d8bf2);color:var(--ink);font:600 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;box-shadow:0 0 0 6px rgba(61,139,242,.25),0 0 24px 6px rgba(120,190,255,.8);animation:kcBomb .5s ease-in-out infinite alternate;touch-action:none}
.kc-trail{position:absolute;z-index:6;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(190,225,255,.6) 50%,rgba(190,225,255,0) 70%)}

.kc-drop>img{width:62%;height:62%;object-fit:contain;filter:drop-shadow(0 4px 4px rgba(20,60,120,.25))}.kc-drop>span{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);padding:3px 8px;border-radius:999px;background:var(--blue);color:#fff;font:600 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.kc-ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);pointer-events:none}.kc-ring circle{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linecap:round}
@keyframes kcDropIn{from{opacity:0;transform:translate(-50%,-120%) scale(.6)}}@keyframes kcBob{to{margin-top:-5px}}

.kc-gauge>i{display:block;width:48px;height:7px;border-radius:4px;background:var(--paper-4);overflow:hidden}.kc-gauge>i>i{display:block;height:100%;border-radius:4px;background:var(--blue)}

@keyframes kcDrop{from{opacity:0;transform:translateY(-36px) scale(1.3)}}@keyframes kcWob{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}@keyframes kcPulse{from{opacity:.45}to{opacity:1}}
@keyframes kcIce{0%{opacity:1;transform:translate(-50%,-50%) scale(.35)}60%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}@keyframes kcToast{from{opacity:0;transform:translateX(-50%) scale(1.4)}to{opacity:1;transform:translateX(-50%) scale(1)}}

.snap-wrap{position:relative;width:min(760px,100%)}

.gp-n3{display:flex;flex-direction:column;align-items:center;gap:10px}
.gp-duck{display:block;height:130px;width:auto;max-width:none;filter:drop-shadow(0 10px 14px rgba(0,0,0,.18));transform:rotate(-6deg)}

.ls-map{padding:20px;display:flex;flex-direction:column;gap:14px;max-width:900px}.ls-map iframe{width:100%;height:clamp(280px,32vw,440px);border:0;border-radius:14px;display:block;background:var(--paper-3)}
.ls-hidden{padding:28px 32px;border-radius:16px;background:var(--paper-3);color:var(--ink-2);font-size:19px;max-width:900px}
/* translate */
